[project]
name = "tiny-transformer-lab"
version = "0.1.0"
description = "A small decoder-only transformer built for learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.6", "numpy>=2.0", "tokenizers>=0.22", "tqdm>=4.67"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
